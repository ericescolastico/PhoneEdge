; PhoneEdge - configuração de exemplo.
; Copie para "phoneedge.ini" ao lado de phoneedge.exe (é lido automaticamente)
; ou use:  phoneedge.exe --config caminho\para\arquivo.ini
; Linhas começando com ; ou # são comentários. Argumentos da linha de comando
; têm prioridade sobre este arquivo.

[phoneedge]

; --- Onde está o celular -------------------------------------------------

; Borda do monitor do PC pela qual o cursor "passa" para o celular:
; left, right, top ou bottom. O celular aparece pela borda oposta dele
; (ex.: edge=right -> o ponteiro surge na borda esquerda do celular).
edge = right

; Número do monitor (0 = principal; veja "phoneedge.exe --list-monitors").
monitor = 0

; --- Tela do celular -----------------------------------------------------

; auto = lê do celular com adb (recomendado). Ou informe LARGURAxALTURA,
; na orientação natural (retrato). Galaxy S22: 1080x2340.
phone_size = auto

; Só se o tamanho for manual ou a leitura automática falhar: 0, 90, 180 ou 270.
phone_rotation = 0

; --- Ponteiro (calibração) -----------------------------------------------

; Pixels do celular que o ponteiro anda para cada unidade enviada. O Android
; aplica sua própria velocidade/aceleração, então este valor precisa ser
; calibrado. Se o ponteiro "volta" cedo demais para o PC, aumente; se demora a
; voltar ou a barra de volta não funciona, diminua.
pointer_scale = 1.0

; Unidades enviadas por movimento do mouse do PC (sensibilidade). >1 = mais rápido.
sensitivity = 1.0

; Multiplicador da roda do mouse.
wheel_scale = 1.0

; --- Atalho de emergência ------------------------------------------------

; Sempre devolve o mouse e o teclado ao PC. Aceita ctrl, alt, shift, win e uma
; tecla (pause, f1-f12, scrolllock, printscreen, letras...).
hotkey = ctrl+alt+pause

; --- Ajustes finos (normalmente não precisa mexer) ------------------------

; Quanto "empurrar" contra a borda do PC (contagens do mouse) para passar.
edge_push = 12
; Quanto "empurrar" contra a borda do celular (pixels) para voltar.
leave_margin = 24
; Distância da borda (pixels do celular) em que o ponteiro aparece.
entry_inset = 24
; Distância da borda (pixels do PC) em que o cursor reaparece ao voltar.
return_inset = 3
; Intervalo mínimo entre relatórios de movimento (ms).
flush_ms = 8
; Tempo após entrar em que não é possível voltar (ms) e após voltar em que não
; é possível entrar de novo (ms).
enter_guard_ms = 300
reenter_ms = 300
; Relatórios extras ao "ancorar" o ponteiro no canto e pausa entre eles (ms).
anchor_extra = 3
place_delay_ms = 2

; --- Conexão com o celular -------------------------------------------------

; Número de série do celular (adb devices). Vazio = o único conectado.
; serial = R5CTXXXXXXX

; Mantém o celular com a tela ligada enquanto estiver conectado.
; stay_awake = yes
